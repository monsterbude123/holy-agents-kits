<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识表面</title>
<style>
  :root {
    --bg:#0F172A; --panel:#1B2336; --muted-bg:#272F42; --line:#475569;
    --fg:#F8FAFC; --dim:#94A3B8; --accent:#22C55E; --gold:#F59E0B; --bad:#EF4444; --link:#5B9DFF;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 "IBM Plex Sans","Segoe UI",system-ui,"Microsoft YaHei",sans-serif; overflow:hidden; }
  #topbar { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  #topbar h1 { font-size:16px; font-weight:600; white-space:nowrap; }
  #search { flex:0 1 320px; background:#111A2E; border:1px solid var(--line); border-radius:8px; color:var(--fg); padding:7px 12px; font:inherit; }
  #search:focus { outline:1px solid var(--accent); }
  #hitcount, #scale { color:var(--dim); font-size:12px; white-space:nowrap; }
  button.tb { background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:12px; white-space:nowrap; }
  button.tb:hover { color:var(--fg); border-color:var(--accent); }
  .hint { color:var(--dim); font-size:11px; white-space:nowrap; }
  #stage { position:absolute; top:53px; bottom:0; left:0; right:0; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); }
  #legend { position:fixed; right:14px; top:66px; display:flex; flex-direction:column; gap:7px; z-index:10; background:rgba(15,23,42,.82); padding:10px 12px; border-radius:10px; border:1px solid var(--line); }
  .lg { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--dim); cursor:pointer; }
  .lg:hover { color:var(--fg); }
  .lg i { width:10px; height:10px; border-radius:3px; display:inline-block; }
  #warn { position:fixed; left:50%; transform:translateX(-50%); top:62px; z-index:20; background:#2A1F12; border:1px solid var(--gold); color:#FCD9A4; border-radius:10px; padding:8px 14px; font-size:12px; max-width:82vw; display:none; }
  #pop { position:fixed; display:none; width:min(600px, 92vw); max-height:min(78vh, 760px); background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 18px 50px rgba(0,0,0,.55); z-index:30; flex-direction:column; overflow:hidden; }
  #pop.open { display:flex; }
  #pophead { display:flex; align-items:flex-start; gap:10px; padding:14px 16px 10px; border-bottom:1px solid var(--line); background:var(--muted-bg); }
  #ptitle { flex:1; font-size:15px; font-weight:600; line-height:1.5; }
  #popclose { background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px; flex:none; }
  #popclose:hover { color:var(--fg); border-color:var(--bad); }
  #popmeta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .badge { font-size:11px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  #popbody { flex:1; overflow:auto; padding:12px 16px 16px; }
  #popbody h4 { color:var(--link); margin:14px 0 6px; font-size:13.5px; }
  #popbody h4:first-child { margin-top:2px; }
  #popbody blockquote { border-left:3px solid var(--accent); background:#12291E; color:#CFEEDB; padding:9px 13px; margin:8px 0; border-radius:6px; font-size:13px; }
  #popbody li { margin:4px 0 4px 18px; color:#D6DCE8; }
  #popbody p { margin:6px 0; }
  #popbody code { background:#111A2E; padding:1px 6px; border-radius:4px; font-size:12px; color:#A5D6FF; }
  #popbody hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  #popbody .essence { color:#E2E8F0; background:#1F2A3E; border-left:3px solid var(--gold); padding:8px 12px; border-radius:6px; margin-bottom:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chip { background:#111A2E; border:1px solid var(--line); color:var(--fg); border-radius:999px; padding:4px 12px; font-size:12px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  .chip b { color:var(--link); font-weight:500; }
  .chip i { color:var(--dim); font-style:normal; }
</style>
</head>
<body>
<div id="topbar">
  <h1 id="ttl">知识表面</h1>
  <input id="search" placeholder="搜标题 / 摘要 / 关键词" autocomplete="off">
  <span id="hitcount"></span>
  <span id="scale"></span>
  <button class="tb" id="expandall">展开全部</button>
  <button class="tb" id="collapseall">收起</button>
  <span class="hint">滚轮缩放 · 拖拽平移 · 点节点展开/收起 · 悬浮看摘要 · 点卡片出明细</span>
</div>
<div id="stage"><div id="loading">载入图谱…</div></div>
<div id="legend"></div>
<div id="warn"></div>

<div id="pop">
  <div id="pophead">
    <div style="flex:1">
      <div id="popmeta"></div>
      <div id="ptitle"></div>
    </div>
    <button id="popclose" title="关闭 (Esc)">✕</button>
  </div>
  <div id="popbody"></div>
</div>

<script>const SURFACE = __SURFACE_JSON__;</script>
<script>
const $ = s => document.querySelector(s);
const S = SURFACE;
const byId = new Map(S.nodes.map(n => [n.id, n]));
/* 同名节点计数：标题撞车时，明细卡的关联条目必须带上下文，否则用户分不清跳到哪个 */
const titleCount = new Map();
for (const n of S.nodes) titleCount.set(n.title, (titleCount.get(n.title) || 0) + 1);
const parentTitle = id => { const p = byId.get(id); const q = p && p.parentId ? byId.get(p.parentId) : null; return q ? q.title : ''; };
const kidsOf = new Map();
for (const n of S.nodes) {
  if (!n.parentId) continue;
  if (!kidsOf.has(n.parentId)) kidsOf.set(n.parentId, []);
  kidsOf.get(n.parentId).push(n);
}
const GCOLOR = new Map(S.groups.map(g => [g.id, g.color]));
const collapsed = new Map();      // 用户展开态（id -> collapsed）：唯一真相源，重建时从这里读回
const LABEL_LIMIT = 40;           // 可见叶节点超过这个数 → 只画点不画标签
let query = '', chart = null, treeCache = null, hitSet = new Set();

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ---------- markdown（明细正文） ---------- */
function md2html(src) {
  const lines = String(src || '').split(/\r?\n/);
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let out = '', list = false;
  const closeList = () => { if (list) { out += '</ul>'; list = false; } };
  for (const raw of lines) {
    if (/^###\s/.test(raw)) { closeList(); out += '<h4>' + inline(raw.replace(/^###\s*/, '')) + '</h4>'; }
    else if (/^####\s/.test(raw)) { closeList(); out += '<h4>' + inline(raw.replace(/^####\s*/, '')) + '</h4>'; }
    else if (/^>\s?/.test(raw)) { closeList(); out += '<blockquote>' + inline(raw.replace(/^>\s?/, '')) + '</blockquote>'; }
    else if (/^[-*]\s+/.test(raw)) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + inline(raw.replace(/^[-*]\s+/, '')) + '</li>'; }
    else if (/^---+$/.test(raw.trim())) { closeList(); out += '<hr>'; }
    else if (!raw.trim()) { closeList(); }
    else { closeList(); out += '<p>' + inline(raw) + '</p>'; }
  }
  closeList();
  return out;
}

/* ---------- 命中判定 ---------- */
function hitText(n) {
  return (n.title + ' ' + (n.summary || '') + ' ' + (n.keywords || []).join(' ') + ' '
    + (n.body || '') + ' ' + (n.file || '')).toLowerCase();
}
function computeHits() {
  hitSet = new Set();
  const q = query.toLowerCase();
  if (!q) return;
  for (const n of S.nodes) if (n.type !== 'root' && hitText(n).includes(q)) hitSet.add(n.id);
}
/* ---------- 树构建 ---------- */
/**
 * 默认展开到第几层：在「可见节点数 ≤ 预算」的前提下的最深一层。
 * 文档库动辄几百个叶子，全展开就是一团毛线；骨架全图才是一眼能看懂的地图。
 */
const NODE_BUDGET = 120;
function autoLevel() {
  const byDepth = new Map();
  let maxDepth = 0;
  for (const n of S.nodes) {
    const d = n.depth || 0;
    if (d > maxDepth) maxDepth = d;
    byDepth.set(d, (byDepth.get(d) || 0) + 1);
  }
  let level = 0, sum = 0;
  for (let d = 0; d <= maxDepth; d++) {
    sum += byDepth.get(d) || 0;
    if (sum <= NODE_BUDGET) level = d; else break;
  }
  return level;
}
const AUTO_LEVEL = autoLevel();
function defaultCollapsed(n) {
  const kids = kidsOf.get(n.id) || [];
  if (!kids.length) return false;
  return (n.depth || 0) >= AUTO_LEVEL;   // 这一层往下默认收起
}
function visibleLeafCount() {
  let c = 0;
  const walk = n => {
    const isCollapsed = collapsed.has(n.id) ? collapsed.get(n.id) : defaultCollapsed(n);
    if (isCollapsed) return;
    if (n.type === 'leaf') { c++; return; }
    (kidsOf.get(n.id) || []).forEach(walk);
  };
  (kidsOf.get('root') || []).forEach(walk);
  return c;
}
function buildTree() {
  computeHits();
  const vis = visibleLeafCount();
  const searching = !!query;
  const showLeafLabels = searching ? true : vis <= LABEL_LIMIT;
  const colorOf = n => GCOLOR.get(n.group) || '#64748B';
  const mk = n => {
    const t = { id: n.id, name: n.title, raw: n, children: (kidsOf.get(n.id) || []).map(mk) };
    const isHit = searching && hitSet.has(n.id);
    const dim = searching && !isHit && n.type !== 'root' && n.type !== 'group';
    if (n.type === 'root') {
      t.symbolSize = 14;
      t.itemStyle = { color: '#F8FAFC' };
      t.label = { position: 'right', distance: 10, fontSize: 15, fontWeight: 700, color: '#F8FAFC' };
    } else if (n.type === 'group') {
      t.symbolSize = 12;
      t.itemStyle = { color: colorOf(n) };
      t.label = { position: 'right', distance: 9, fontSize: 14, fontWeight: 700, color: colorOf(n) };
    } else if (n.type === 'file') {
      t.symbolSize = 9;
      t.itemStyle = { color: colorOf(n) };
      t.label = {
        position: 'right', distance: 8, fontSize: 12.5, fontWeight: 600,
        color: isHit ? '#F59E0B' : '#F8FAFC',
        backgroundColor: 'rgba(15,23,42,.72)', padding: [1, 3], borderRadius: 3,   // 长标题互相压字时仍可读
      };
    } else {
      t.symbolSize = n.type === 'section' ? 6.5 : 5.5;
      t.itemStyle = { color: n.type === 'empty' ? '#64748B' : colorOf(n) + 'CC' };
      t.label = {
        show: showLeafLabels, position: 'right', distance: 6, fontSize: 11.5,
        color: isHit ? '#F59E0B' : '#C7CFDC', fontWeight: isHit ? 700 : 400,
        opacity: dim ? .35 : 1,
      };
    }
    // 搜索态：命中项及其祖先链强制展开，其余收起（根节点永远展开，否则整图消失）
    if (searching) {
      t.collapsed = !(isHit || hasHitDescendant(n.id));
    } else {
      t.collapsed = collapsed.has(n.id) ? collapsed.get(n.id) : defaultCollapsed(n);
    }
    return t;
  };
  const rootNode = byId.get('root');
  return [mk(rootNode)];
}
function hasHitDescendant(id) {
  for (const k of (kidsOf.get(id) || [])) {
    if (hitSet.has(k.id)) return true;
    if (hasHitDescendant(k.id)) return true;
  }
  return false;
}

/* ---------- 渲染 ---------- */
function fullOption() {
  return {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item', triggerOn: 'mousemove', enterable: false,
      backgroundColor: '#1B2336', borderColor: '#475569', borderWidth: 1,
      padding: [10, 14], textStyle: { color: '#F8FAFC', fontSize: 12 },
      extraCssText: 'border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);',
      formatter: tooltipHtml,
    },
    series: [{
      type: 'tree', data: JSON.parse(JSON.stringify(treeCache)), orient: 'LR', edgeShape: 'curve',
      expandAndCollapse: true, roam: true,
      top: '2%', left: '5%', bottom: '2%', right: '28%',
      lineStyle: { width: 1.1, color: '#33415C' },
      emphasis: { focus: 'none', itemStyle: { shadowBlur: 12, shadowColor: 'rgba(34,197,94,.35)' } },
    }],
  };
}
function renderTree() {
  treeCache = buildTree();
  chart.setOption(fullOption(), true);   // notMerge：tree 系列的 merge 会残留旧内部状态
}

/* ---------- tooltip：摘要（一句话） ---------- */
function tooltipHtml(params) {
  const d = params.data && params.data.raw;
  if (!d) return '';
  const color = GCOLOR.get(d.group) || '#94A3B8';
  if (d.type === 'root') {
    return `<div><b>${esc(d.title)}</b><br><span style="color:#94A3B8">${S.counts.files} 文件 · ${S.counts.groups} 组 · ${S.counts.leaves} 叶节点</span></div>`;
  }
  if (d.type === 'group') {
    const kids = (kidsOf.get(d.id) || []).length;
    return `<div><b style="color:${color}">${esc(d.title)}</b><br><span style="color:#94A3B8">${kids} 个文件 · 点开看内容</span></div>`;
  }
  const sum = d.summary ? `<div style="color:#C7CFDC">${esc(d.summary)}</div>` : '<div style="color:#EF4444">（无摘要）</div>';
  return `<div style="max-width:340px;white-space:normal;line-height:1.6">
    <div style="color:${color};font-size:11px;margin-bottom:4px">${esc(d.file || d.title)}</div>
    <div style="font-weight:600;margin-bottom:6px">${esc(d.title)}</div>
    ${sum}
    <div style="color:#94A3B8;font-size:11px;margin-top:6px">点击查看完整内容</div></div>`;
}

/* ---------- 明细卡（披露第二层） ---------- */
function showPop(n, px, py) {
  const color = GCOLOR.get(n.group) || '#94A3B8';
  $('#popmeta').innerHTML =
    `<span class="badge" style="border-color:${color};color:${color}">${esc((S.groups.find(g => g.id === n.group) || {}).name || '—')}</span>` +
    (n.file ? `<span class="badge">${esc(n.file)}</span>` : '') +
    `<span class="badge">${esc(n.type)}</span>`;
  $('#ptitle').textContent = n.title;
  const rel = (n.links || []).map(l => {
    const r = byId.get(l.id); if (!r) return '';
    const why = l.basis === 'kw' ? (l.shared && l.shared[0] ? l.shared[0] : '关键词') : '同文件相邻';
    const t = r.title.length > 24 ? r.title.slice(0, 24) + '…' : r.title;
    // 标题在语料里不唯一 → 补一段上下文（父级小节名），否则关联条目指代不清
    const ctx = (titleCount.get(r.title) || 0) > 1 ? ` <i>· ${esc(parentTitle(l.id) || r.file || '')}</i>` : '';
    return `<span class="chip" data-rel="${esc(l.id)}">${esc(t)}${ctx} <i>· ${esc(why)}</i></span>`;
  }).join('');
  const body = n.body ? md2html(n.body) : '<p style="color:#94A3B8">（该节点无正文）</p>';
  $('#popbody').innerHTML =
    (n.summary ? `<h4>一句话</h4><div class="essence">${esc(n.summary)}</div>` : '') +
    `<h4>全文</h4>${body}` +
    (rel ? `<h4>关联</h4><div class="chips">${rel}</div>` : '');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => jumpTo(c.dataset.rel));
  const pop = $('#pop');
  pop.classList.add('open');
  const w = Math.min(600, innerWidth * .92), h = Math.min(760, innerHeight * .78);
  pop.style.left = Math.max(10, Math.min(px + 20, innerWidth - w - 12)) + 'px';
  pop.style.top = Math.max(60, Math.min(py - 20, innerHeight - h - 12)) + 'px';
  $('#popbody').scrollTop = 0;
}
const hidePop = () => $('#pop').classList.remove('open');

/* ---------- 跳转：展开祖先 + 高亮 ---------- */
function jumpTo(id) {
  const n = byId.get(id); if (!n) return;
  const targets = new Set([id]);
  let p = n.parentId;
  while (p) { targets.add(p); const x = byId.get(p); p = x ? x.parentId : null; }
  const walk = node => {
    node.children && node.children.forEach(walk);
    if (targets.has(node.id)) { node.collapsed = false; collapsed.set(node.id, false); }
  };
  walk(treeCache[0]);
  renderTree();
  flash(id);
  hidePop();
}
function flash(id) {
  const paint = arr => arr.forEach(n => {
    if (n.id === id) { n.__saved = n.label; n.label = Object.assign({}, n.label || {}, { color: '#F59E0B', fontWeight: 800, fontSize: 13 }); }
    if (n.children) paint(n.children);
  });
  paint(treeCache);
  renderTree();
  setTimeout(() => {
    const restore = arr => arr.forEach(n => {
      if (n.id === id && n.__saved) { n.label = n.__saved; delete n.__saved; }
      if (n.children) restore(n.children);
    });
    restore(treeCache);
    renderTree();
  }, 1600);
}

/* ---------- 顶栏 / 图例 ---------- */
function paintCounts() {
  const c = S.counts;
  $('#scale').textContent = `${c.files} 文件 · ${c.groups} 组 · ${c.leaves} 叶节点 · ${c.linked} 有关联 · 默认展开 ${AUTO_LEVEL + 1} 层`;
  $('#hitcount').textContent = query ? `${hitSet.size} 个命中` : '';
}
function renderLegend() {
  $('#legend').innerHTML = S.groups.map(g => `<span class="lg" data-g="${esc(g.id)}"><i style="background:${g.color}"></i>${esc(g.name)}</span>`).join('');
  document.querySelectorAll('.lg').forEach(el => el.onclick = () => {
    const g = byId.get('g:' + el.dataset.g);
    if (g) jumpTo(g.id);
  });
}

/* ---------- 启动 ---------- */
function start() {
  if (!window.echarts) {
    $('#loading').innerHTML = '<span style="color:#EF4444">ECharts 未加载（离线环境请用 --echarts 指定本地 echarts.min.js）</span>';
    return;
  }
  document.title = S.title || '知识表面';
  $('#ttl').textContent = S.title || '知识表面';
  renderLegend();
  paintCounts();
  if (S.warnings && S.warnings.length) {
    const w = $('#warn');
    w.textContent = '⚠ ' + S.warnings.join(' · ');
    w.style.display = 'block';
    w.onclick = () => { w.style.display = 'none'; };
  }
  const load = $('#loading');
  load && load.remove();        // echarts.init 会清空容器 → 先移除，再 init
  chart = echarts.init($('#stage'));
  renderTree();
  chart.on('click', params => {
    const d = params.data && params.data.raw; if (!d) return;
    if (d.type === 'leaf' || d.type === 'empty') {
      showPop(d, params.event.offsetX, params.event.offsetY);
      return;
    }
    // 非叶节点 = 展开/收起。params.collapsed 是「切换后」的状态，必须回写，否则重建时丢
    collapsed.set(d.id, !!params.collapsed);
    renderTree();
  });
  chart.getZr().on('click', e => { if (!e.target) hidePop(); });
  window.addEventListener('resize', () => chart.resize());
  $('#search').oninput = e => { query = e.target.value.trim(); renderTree(); paintCounts(); };
  $('#expandall').onclick = () => {
    const walk = n => { collapsed.set(n.id, false); (kidsOf.get(n.id) || []).forEach(walk); };
    walk(byId.get('root'));
    renderTree();
  };
  $('#collapseall').onclick = () => {
    const walk = n => {
      const kids = kidsOf.get(n.id) || [];
      collapsed.set(n.id, n.type !== 'root' && kids.length > 0);
      kids.forEach(walk);
    };
    walk(byId.get('root'));
    renderTree();
  };
  $('#popclose').onclick = hidePop;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePop(); });
}
start();
</script>
</body>
